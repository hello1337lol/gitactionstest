name: Check Artemis Status

on:
  schedule:
    # Runs every 15 minutes (adjust as needed)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Artemis
        id: ping
        continue-on-error: true
        run: |
          RESPONSE=$(curl -s --max-time 10 https://artemis.cockatoo-dory.ts.net/ping)
          echo "Response received: '$RESPONSE'"
          
          if [ "$RESPONSE" = "pong" ]; then
            echo "status=online" >> $GITHUB_OUTPUT
          else
            echo "status=offline" >> $GITHUB_OUTPUT
          fi

      - name: Get Unix Timestamp
        id: time
        run: |
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Update Discord Notification (Online)
        if: steps.ping.outputs.status == 'online'
        run: |
          curl -H "Content-Type: application/json" \
               -X PATCH \
               -d "{\"content\": \"Artemis is 🟩 **online** 🟩 as of <t:${{ steps.time.outputs.timestamp }}:R>.\"}" \
               "${{ secrets.DISCORD_WEBHOOK_URL }}/messages/1560454288382230680"

      - name: Update Discord Notification (Offline)
        if: steps.ping.outputs.status != 'online'
        run: |
          curl -H "Content-Type: application/json" \
               -X PATCH \
               -d "{\"content\": \"Artemis is 🟥 **offline** 🟥 as of <t:${{ steps.time.outputs.timestamp }}:R>.\"}" \
               "${{ secrets.DISCORD_WEBHOOK_URL }}/messages/1560454288382230680"
